services:
  postgres:
    image: postgres:17
    container_name: booru-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-booru}
      POSTGRES_USER: ${POSTGRES_USER:-booru}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booru}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  backend:
    build: .
    container_name: booru-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/booru}
      DATABASE_USER: ${POSTGRES_USER:-booru}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-booru}
      JWT_SECRET: ${JWT_SECRET:-change_me_now}
      UPLOAD_ROOT: ${UPLOAD_ROOT:-/app/data/uploads}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      AUTO_APPROVE_MEMBERS: ${AUTO_APPROVE_MEMBERS:-false}
    volumes:
      - uploads_data:/app/data/uploads
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  uploads_data:
